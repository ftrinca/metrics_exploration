# Packaging metadata. Installing is optional: the run scripts put the
# repository root on PYTHONPATH themselves. `pip install -e .` exists so the modules can be run
# from any directory, and so `pytest` needs no sys.path manipulation.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "metric-eval"
version = "1.0.0"
description = "Comparative analysis of evaluation metrics for time series imputation"
readme = "README.md"
requires-python = ">=3.10"
# Read from requirements.txt rather than repeated here, so the upper bounds and
# the reasons stated next to them cannot drift apart from what pip installs.
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
# Flat layout: the repository root holds exactly one package, metric_eval;
# the include filter keeps deliverables/, outputs/, scripts/ and tests/ out.
include = ["metric_eval*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
